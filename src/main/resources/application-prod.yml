spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  ai:
    model:
      chat: google-genai
      embedding:
        text: google-genai
    google:
      genai:
        api-key: ${AI_API_KEY}
        chat:
          model: gemini-3.5-flash-lite
        embedding:
          api-key: ${AI_API_KEY}
          text:
            model: gemini-embedding-001
            dimensions: 768
    vectorstore:
      type: mariadb
      mariadb:
        initialize-schema: false
        dimensions: 768
        distance-type: COSINE
        table-name: vector_store
        schema-validation: true
