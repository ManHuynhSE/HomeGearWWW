spring.application.name=DemoPrj
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/demoprj}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sapassword}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true
server.error.whitelabel.enabled=false
homegear.shipping.free-threshold=500000

# Public footer/contact details; leave values blank until verified.
homegear.store.contact.hotline=0915994882
