spring.config.import=optional:file:.env[.properties]
spring.application.name=DemoPrj
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/demoprj}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sapassword}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true
server.error.whitelabel.enabled=false
# AI is opt-in; the dev/prod profiles enable the configured provider.
spring.ai.model.chat=dev
spring.ai.model.embedding.text=none
spring.ai.vectorstore.type=none
# Keep the Google embedding connection auto-configuration inert in the default profile.
spring.ai.google.genai.embedding.api-key=${AI_API_KEY:not-configured}
homegear.ai.request-timeout-ms=30000
homegear.shipping.free-threshold=500000
homegear.shipping.flat-fee=30000

# Public footer/contact details; leave values blank until verified.
homegear.store.contact.hotline=0915994882
homegear.store.contact.email=homegear@service.com
homegear.store.contact.address=
homegear.store.policy.shipping-url=
homegear.store.policy.returns-url=
homegear.store.policy.warranty-url=
homegear.store.policy.privacy-url=
homegear.store.social.facebook-url=
homegear.store.social.instagram-url=
homegear.store.social.youtube-url=
homegear.store.channel.zalo-url=
homegear.store.channel.messenger-url=

# Enable only payment methods currently supported by the checkout flow.
homegear.store.payment.cod-enabled=true
homegear.store.payment.bank-transfer-enabled=false
homegear.store.payment.vnpay-enabled=false
homegear.store.payment.momo-enabled=false
