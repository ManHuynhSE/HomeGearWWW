<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head><body>
<header th:replace="~{fragments :: navbar}"></header>
<main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><p class="text-primary fw-semibold mb-1">YOUR CART</p><h1 class="fw-bold mb-0">Giỏ hàng</h1></div><a class="btn btn-outline-primary" href="/products"><i class="bi bi-arrow-left me-2"></i>Tiếp tục mua</a></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div th:if="${#maps.isEmpty(items)}" class="empty-state rounded-4 p-5 text-center"><i class="bi bi-cart-x fs-1 text-secondary"></i><h4 class="mt-3">Giỏ hàng đang trống</h4><a href="/products" class="btn btn-primary mt-2">Xem sản phẩm</a></div>
<div th:unless="${#maps.isEmpty(items)}" class="card border-0 shadow-sm rounded-4"><div class="table-responsive"><table class="table mb-0 align-middle"><thead class="table-light"><tr><th>Sản phẩm</th><th>Đơn giá</th><th style="width:220px">Số lượng</th></tr></thead>
<tbody><tr th:each="entry : ${items}"><td><strong th:text="${entry.value.name}"></strong><div class="small text-secondary" th:text="${entry.value.category.name}"></div><span th:if="${entry.value.stock <= 0}" class="badge text-bg-danger mt-1">Hết hàng</span></td><td class="price" th:text="${#numbers.formatDecimal(entry.value.price, 0, 'POINT', 0, 'POINT')} + ' ₫'"></td><td><form class="d-flex gap-2" method="post" action="/cart/update"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="productId" th:value="${entry.key}"><input class="form-control" name="quantity" type="number" min="0" th:value="${quantities[entry.key]}"><button class="btn btn-outline-primary"><i class="bi bi-arrow-repeat"></i></button></form></td></tr></tbody></table></div>
<div class="card-footer bg-white border-0 p-4 text-end"><p class="text-secondary mb-2">Sẵn sàng hoàn tất đơn hàng?</p><form method="post" action="/checkout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-primary btn-lg"><i class="bi bi-bag-check me-2"></i>Đặt hàng</button></form></div></div>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
