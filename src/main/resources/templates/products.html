<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<header th:replace="~{fragments :: navbar}"></header>
<main class="container store-products-page py-4">
  <nav aria-label="Điều hướng đường dẫn" class="mb-3">
    <ol class="breadcrumb store-breadcrumb mb-0">
      <li class="breadcrumb-item"><a href="/">Trang chủ</a></li>
      <li th:if="${selectedCategory != null}" class="breadcrumb-item active" aria-current="page" th:text="${selectedCategory.name}"></li>
      <li th:if="${selectedCategory == null and keyword != ''}" class="breadcrumb-item active" aria-current="page">Tìm kiếm</li>
      <li th:if="${selectedCategory == null and keyword == ''}" class="breadcrumb-item active" aria-current="page">Sản phẩm</li>
    </ol>
  </nav>
  <div class="row g-4">
    <aside class="col-lg-3">
      <form id="catalog-filter" method="get" action="/products" class="catalog-filter-panel">
        <h2 class="catalog-filter-title">Lọc sản phẩm</h2>
        <input type="hidden" name="keyword" th:value="${keyword}">
        <input type="hidden" name="page" value="0">
        <label class="form-label" for="catalog-category">Danh mục</label>
        <select id="catalog-category" class="form-select mb-3" name="categoryId">
          <option value="">Tất cả danh mục</option>
          <option th:each="category : ${storeCategories}" th:value="${category.id}"
                  th:text="${category.name}" th:selected="${categoryId != null and category.id == categoryId}"></option>
        </select>
        <label class="form-label">Khoảng giá (₫)</label>
        <div class="d-flex gap-2 mb-3">
          <input class="form-control" type="number" min="0" step="1000" name="minPrice" placeholder="Từ"
                 aria-label="Giá thấp nhất" th:value="${minPrice}">
          <input class="form-control" type="number" min="0" step="1000" name="maxPrice" placeholder="Đến"
                 aria-label="Giá cao nhất" th:value="${maxPrice}">
        </div>
        <label class="form-check catalog-stock-filter mb-3">
          <input class="form-check-input" type="checkbox" name="inStockOnly" value="true" th:checked="${inStockOnly}">
          <span class="form-check-label">Chỉ xem sản phẩm còn hàng</span>
        </label>
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-funnel me-1"></i>Áp dụng bộ lọc</button>
        <a class="catalog-reset-link" href="/products">Xóa tất cả bộ lọc</a>
      </form>
    </aside>
    <section class="col-lg-9" aria-labelledby="catalog-title">
      <div class="store-section-heading catalog-heading align-items-end mb-3">
        <div>
          <p class="store-eyebrow" th:text="${selectedCategory != null ? 'DANH MỤC' : 'HOMEGEAR'}"></p>
          <h1 id="catalog-title" th:text="${selectedCategory != null ? selectedCategory.name : (keyword != '' ? 'Kết quả tìm kiếm' : 'Tất cả sản phẩm')}"></h1>
          <p class="text-secondary small mb-0"><span th:text="${catalogPage.totalElements}"></span> sản phẩm</p>
        </div>
        <label class="catalog-sort-label">Sắp xếp
          <select class="form-select" name="sort" form="catalog-filter">
            <option value="newest" th:selected="${sort == 'newest'}">Mới nhất</option>
            <option value="priceAsc" th:selected="${sort == 'priceAsc'}">Giá tăng dần</option>
            <option value="priceDesc" th:selected="${sort == 'priceDesc'}">Giá giảm dần</option>
            <option value="bestSelling" th:selected="${sort == 'bestSelling'}">Bán chạy</option>
          </select>
        </label>
      </div>
      <p th:if="${filterError != null}" class="alert alert-warning py-2" role="alert" th:text="${filterError}"></p>
      <div th:if="${#lists.isEmpty(products)}" class="empty-state rounded-4 p-5 text-center">
        <i class="bi bi-search fs-1 text-secondary"></i>
        <h3 class="mt-3">Không tìm thấy sản phẩm</h3>
        <p class="text-secondary mb-3">Thử đổi từ khóa hoặc nới lỏng bộ lọc để xem thêm sản phẩm.</p>
        <a href="/products" class="btn btn-outline-primary">Xem tất cả sản phẩm</a>
      </div>
      <div class="row g-3">
        <div class="col-sm-6 col-xl-4" th:each="product : ${products}">
          <div th:replace="~{fragments :: productCard(${product})}"></div>
        </div>
      </div>
      <nav th:if="${catalogPage.totalPages > 1}" class="mt-4" aria-label="Phân trang sản phẩm">
        <ul class="pagination justify-content-center flex-wrap">
          <li class="page-item" th:classappend="${catalogPage.first ? ' disabled' : ''}">
            <a th:if="${!catalogPage.first}" class="page-link"
               th:href="@{/products(keyword=${keyword},categoryId=${categoryId},minPrice=${minPrice},maxPrice=${maxPrice},inStockOnly=${inStockOnly},sort=${sort},page=${page - 1})}">Trước</a>
            <span th:if="${catalogPage.first}" class="page-link">Trước</span>
          </li>
          <li th:each="pageNumber : ${pageNumbers}" class="page-item"
              th:classappend="${pageNumber == catalogPage.number ? ' active' : ''}">
            <a class="page-link" th:href="@{/products(keyword=${keyword},categoryId=${categoryId},minPrice=${minPrice},maxPrice=${maxPrice},inStockOnly=${inStockOnly},sort=${sort},page=${pageNumber})}"
               th:text="${pageNumber + 1}"></a>
          </li>
          <li class="page-item" th:classappend="${catalogPage.last ? ' disabled' : ''}">
            <a th:if="${!catalogPage.last}" class="page-link"
               th:href="@{/products(keyword=${keyword},categoryId=${categoryId},minPrice=${minPrice},maxPrice=${maxPrice},inStockOnly=${inStockOnly},sort=${sort},page=${page + 1})}">Tiếp</a>
            <span th:if="${catalogPage.last}" class="page-link">Tiếp</span>
          </li>
        </ul>
      </nav>
    </section>
  </div>
</main>
<div th:replace="~{fragments :: productQuickViewModal}"></div>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
