<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<header th:replace="~{fragments :: navbar}"></header>
<main class="container py-4">
  <section class="hero position-relative p-4 p-lg-5 mb-5">
    <div class="hero-orb"></div>
    <div class="position-relative col-lg-7">
      <span class="badge text-bg-light text-primary mb-3">Mua sắm thông minh</span>
      <h1 class="display-5 fw-bold">Thiết bị tốt cho một ngôi nhà tốt hơn.</h1>
      <p class="lead opacity-75">Khám phá các sản phẩm gia dụng và thiết bị thông minh được chọn lọc cho cuộc sống tiện nghi.</p>
      <a href="#catalog" class="btn btn-light text-primary fw-semibold">Khám phá sản phẩm <i class="bi bi-arrow-down ms-1"></i></a>
    </div>
  </section>
  <div id="catalog" class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
    <div><p class="text-primary fw-semibold mb-1">CATALOG</p><h2 class="fw-bold mb-0">Sản phẩm nổi bật</h2></div>
    <form method="get" action="/products" class="d-flex gap-2">
      <input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm sản phẩm...">
      <button class="btn btn-primary"><i class="bi bi-search"></i></button>
    </form>
  </div>
  <div th:if="${#lists.isEmpty(products)}" class="empty-state rounded-4 p-5 text-center">
    <i class="bi bi-search fs-1 text-secondary"></i><h4 class="mt-3">Không tìm thấy sản phẩm</h4>
  </div>
  <div class="row g-4">
    <div class="col-sm-6 col-lg-4" th:each="product : ${products}">
      <article class="card product-card h-100 border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="product-visual"><i class="bi bi-house-gear"></i></div>
        <div class="card-body d-flex flex-column p-4">
          <span class="badge bg-primary-subtle text-primary align-self-start mb-2" th:text="${product.category.name}"></span>
          <h5 class="card-title"><a class="text-decoration-none text-dark" th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}"></a></h5>
          <p class="text-secondary small flex-grow-1" th:text="${product.description}"></p>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
            <span class="small text-secondary"><i class="bi bi-box-seam me-1"></i><span th:text="${product.stock}"></span> còn lại</span>
          </div>
          <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-primary w-100"><i class="bi bi-cart-plus me-2"></i>Thêm vào giỏ</button>
          </form>
        </div>
      </article>
    </div>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
