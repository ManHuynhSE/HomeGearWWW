<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head><body><header th:replace="~{fragments :: navbar}"></header>
<main class="container py-5"><div class="mb-4"><p class="text-primary fw-semibold mb-1">ACCOUNT</p><h1 class="fw-bold">Lịch sử đơn hàng</h1></div>
<div th:if="${param.success}" class="alert alert-success"><i class="bi bi-check-circle me-2"></i>Đặt hàng thành công.</div>
<div th:if="${#lists.isEmpty(orders)}" class="empty-state rounded-4 p-5 text-center"><i class="bi bi-receipt fs-1 text-secondary"></i><h4 class="mt-3">Bạn chưa có đơn hàng</h4></div>
<div th:unless="${#lists.isEmpty(orders)}" class="card border-0 shadow-sm rounded-4"><div class="table-responsive"><table class="table table-hover mb-0 align-middle"><thead class="table-light"><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="order : ${orders}"><td class="fw-semibold" th:text="'#' + ${order.id}"></td><td th:text="${order.createdAt}"></td><td class="price" th:text="${#numbers.formatDecimal(order.total, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td><td><span class="badge text-bg-primary" th:text="${order.status}"></span></td></tr></tbody></table></div></div>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
