<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head><body>
<header th:replace="~{fragments :: navbar}"></header>
<main class="container auth-shell"><div class="card auth-card border-0 shadow rounded-4 p-4 p-md-5">
  <div class="text-center mb-4"><div class="text-primary fs-1"><i class="bi bi-person-circle"></i></div><h1 class="h3 fw-bold">Chào mừng trở lại</h1><p class="text-secondary">Đăng nhập để tiếp tục mua sắm</p></div>
  <div th:if="${param.error}" class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i>Email hoặc mật khẩu không đúng.</div>
  <div th:if="${param.logout}" class="alert alert-success">Bạn đã đăng xuất.</div>
  <div class="alert alert-info small"><i class="bi bi-info-circle me-2"></i>Admin demo: admin@demoprj.local / Admin@123</div>
  <form method="post" action="/login">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label class="form-label">Email</label><input class="form-control form-control-lg mb-3" name="username" type="email" required>
    <label class="form-label">Mật khẩu</label><input class="form-control form-control-lg mb-4" name="password" type="password" required>
    <button class="btn btn-primary btn-lg w-100">Đăng nhập</button>
  </form>
  <p class="text-center text-secondary mt-4 mb-0">Chưa có tài khoản? <a href="/register">Đăng ký ngay</a></p>
</div></main>
<footer th:replace="~{fragments :: footer}"></footer></body></html>
