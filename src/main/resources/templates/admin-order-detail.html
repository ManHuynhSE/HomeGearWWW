<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head><body><header th:replace="~{fragments :: navbar}"></header>
<main class="container py-5"><a href="/admin" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Quay lại quản trị</a>
<div class="d-flex justify-content-between align-items-center mt-3 mb-4"><h1 class="fw-bold mb-0">Đơn hàng #<span th:text="${order.id}"></span></h1><span class="badge text-bg-primary fs-6" th:text="${order.status}"></span></div>
<p th:if="${error}" class="alert alert-danger" th:text="${error}"></p>
<div class="row g-4"><div class="col-lg-4"><div class="card border-0 shadow-sm rounded-4 p-4"><p class="text-secondary mb-1">Khách hàng</p><h5 th:text="${order.customer.email}"></h5><p class="text-secondary mb-1 mt-3">Ngày đặt</p><p th:text="${order.createdAt}"></p><p class="text-secondary mb-1">Tổng tiền</p><div class="price fs-4" th:text="${#numbers.formatDecimal(order.total, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div><form class="mt-4" th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label class="form-label">Cập nhật trạng thái</label><select class="form-select mb-2" name="status"><option th:each="status : ${orderStatuses}" th:value="${status}" th:text="${status}" th:selected="${status == order.status}"></option></select><button class="btn btn-primary w-100">Lưu trạng thái</button></form></div></div>
<div class="col-lg-8"><div class="card border-0 shadow-sm rounded-4"><div class="card-header bg-white border-0 p-4"><h2 class="h5 fw-bold mb-0">Sản phẩm trong đơn</h2></div><div class="card-body pt-0 table-responsive"><table class="table align-middle"><thead class="table-light"><tr><th>Sản phẩm</th><th>Số lượng</th><th>Đơn giá</th></tr></thead><tbody><tr th:each="item : ${order.items}"><td class="fw-semibold" th:text="${item.product.name}"></td><td th:text="${item.quantity}"></td><td class="price" th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td></tr></tbody></table></div></div></div></div>
</main><footer th:replace="~{fragments :: footer}"></footer></body></html>
