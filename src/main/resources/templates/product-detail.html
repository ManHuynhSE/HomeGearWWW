<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head><body>
<header th:replace="~{fragments :: navbar}"></header>
<main class="container py-5">
  <a href="/products" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Quay lại sản phẩm</a>
  <div class="row g-5 align-items-center mt-2">
    <div class="col-md-5"><div class="product-visual rounded-4 shadow-sm"><i class="bi bi-house-gear"></i></div></div>
    <div class="col-md-7">
      <span class="badge bg-primary-subtle text-primary mb-3" th:text="${product.category.name}"></span>
      <h1 class="display-6 fw-bold" th:text="${product.name}"></h1>
      <p class="lead text-secondary" th:text="${product.description}"></p>
      <div class="price fs-3 mb-2" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
      <p class="text-secondary"><i class="bi bi-box-seam me-2"></i>Còn <strong th:text="${product.stock}"></strong> sản phẩm</p>
      <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-primary btn-lg px-4"><i class="bi bi-cart-plus me-2"></i>Thêm vào giỏ</button>
      </form>
    </div>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer></body></html>
