<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head><body>
<header th:replace="~{fragments :: navbar}"></header>
<main class="container py-5">
  <a href="/products" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Quay lại sản phẩm</a>
  <div class="row g-5 align-items-center mt-2">
    <div class="col-md-5"><div class="product-visual rounded-4 shadow-sm"><i class="bi bi-house-gear"></i></div></div>
    <div class="col-md-7">
      <span class="badge bg-primary-subtle text-primary mb-3" th:text="${product.category.name}"></span>
      <h1 class="display-6 fw-bold" th:text="${product.name}"></h1>
      <p class="lead text-secondary" th:text="${product.description}"></p>
      <div class="product-detail-prices mb-2">
        <div class="price fs-3" th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0, 'POINT')} + ' ₫'"></div>
        <del th:if="${promotionActive}" class="text-secondary" th:text="${#numbers.formatDecimal(product.originalPrice, 0, 'POINT', 0, 'POINT')} + ' ₫'"></del>
        <span th:if="${promotionActive}" class="product-promo-badge position-static" th:text="${'-' + product.discountPercent + '%'}"></span>
      </div>
      <p th:class="${product.stock > 0 ? 'text-secondary' : 'text-danger fw-semibold'}">
        <i class="bi bi-box-seam me-2"></i><span th:if="${product.stock > 0}">Còn <strong th:text="${product.stock}"></strong> sản phẩm</span><strong th:if="${product.stock <= 0}">Hết hàng</strong>
      </p>
      <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-lg px-4" th:classappend="${product.stock > 0 ? ' btn-primary' : ' btn-secondary'}" th:disabled="${product.stock <= 0}">
          <i class="bi me-2" th:classappend="${product.stock > 0 ? ' bi-cart-plus' : ' bi-slash-circle'}"></i><span th:text="${product.stock > 0 ? 'Thêm vào giỏ' : 'Hết hàng'}"></span>
        </button>
      </form>
    </div>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer></body></html>
