<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head><body>
<header th:replace="~{fragments :: navbar}"></header>
<main class="container auth-shell"><div class="card auth-card border-0 shadow rounded-4 p-4 p-md-5">
  <div class="text-center mb-4"><div class="text-primary fs-1"><i class="bi bi-person-plus-fill"></i></div><h1 class="h3 fw-bold">Tạo tài khoản</h1><p class="text-secondary">Bắt đầu hành trình mua sắm dễ dàng hơn</p></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <form method="post" action="/register">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label class="form-label">Họ và tên</label><input class="form-control mb-3" name="fullName" required>
    <label class="form-label">Email</label><input class="form-control mb-3" name="email" type="email" required>
    <label class="form-label">Mật khẩu</label><input class="form-control mb-4" name="password" type="password" minlength="8" required>
    <button class="btn btn-primary btn-lg w-100">Đăng ký</button>
  </form>
  <p class="text-center text-secondary mt-4 mb-0">Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
</div></main>
<footer th:replace="~{fragments :: footer}"></footer></body></html>
