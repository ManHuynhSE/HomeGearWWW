<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<head th:fragment="head">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeGear</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<header th:fragment="navbar" class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="/products">
      <i class="bi bi-house-heart-fill me-2"></i>HomeGear
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="mainNav" class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/products">Sản phẩm</a></li>
        <li class="nav-item"><a class="nav-link" href="/cart"><i class="bi bi-cart3 me-1"></i>Giỏ hàng</a></li>
        <li class="nav-item" th:if="${currentUser}"><a class="nav-link" href="/orders">Đơn hàng</a></li>
        <li class="nav-item" th:if="${isAdmin}"><a class="nav-link" href="/admin">Quản trị</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <span th:if="${currentUser}" class="small text-secondary">
          <i class="bi bi-person-circle me-1"></i><span th:text="${currentUser.name}"></span>
        </span>
        <form th:if="${currentUser}" method="post" action="/logout">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn btn-outline-secondary btn-sm">Đăng xuất</button>
        </form>
        <span th:unless="${currentUser}" class="d-flex gap-2">
          <a class="btn btn-outline-primary btn-sm" href="/login">Đăng nhập</a>
          <a class="btn btn-primary btn-sm" href="/register">Đăng ký</a>
        </span>
      </div>
    </div>
  </div>
</header>

<footer th:fragment="footer" class="footer mt-5 py-4 bg-white">
  <div class="container d-flex justify-content-between flex-wrap gap-2 small text-secondary">
    <span>© 2026 HomeGear · Thiết bị gia đình thông minh</span>
    <span>Trải nghiệm mua sắm tiện lợi mỗi ngày</span>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
